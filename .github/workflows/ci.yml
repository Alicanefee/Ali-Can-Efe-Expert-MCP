name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check (server and worker)
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Bundle Cloudflare worker (dry run)
        run: npx wrangler deploy --dry-run --outdir /tmp/worker-bundle
        env:
          WRANGLER_SEND_METRICS: 'false'

      - name: Verify server starts
        run: |
          timeout 5 node dist/index.js < /dev/null 2>&1 | tee /tmp/server-output.txt
          grep -q "Server started" /tmp/server-output.txt

      - name: Verify resources load
        run: |
          timeout 5 node dist/index.js < /dev/null 2>&1 | tee /tmp/server-output.txt
          grep -q "Ali Can Efe" /tmp/server-output.txt
          grep -q "medical_imaging_product_management" /tmp/server-output.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: server-output
          path: /tmp/server-output.txt
