name = "ali-can-efe-mcp"
main = "deploy/cloudflare-worker.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# After `npm run deploy:cloudflare` the worker is served from your workers.dev subdomain:
#   https://ali-can-efe-mcp.<your-subdomain>.workers.dev/      info page with client config snippets
#   https://ali-can-efe-mcp.<your-subdomain>.workers.dev/mcp   MCP endpoint (Streamable HTTP)
#
# The JSON resources in src/resources/ are bundled into the worker at deploy time.

[observability]
enabled = true
